<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BalootScore - Join Live Session</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .card {
            background: white;
            border-radius: 24px;
            padding: 40px 30px;
            max-width: 380px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .icon {
            font-size: 64px;
            margin-bottom: 16px;
        }
        h1 {
            font-size: 24px;
            color: #1a1a1a;
            margin-bottom: 8px;
        }
        p {
            font-size: 16px;
            color: #666;
            margin-bottom: 24px;
            line-height: 1.5;
        }
        .btn {
            display: inline-block;
            background: #007AFF;
            color: white;
            text-decoration: none;
            padding: 14px 32px;
            border-radius: 14px;
            font-size: 17px;
            font-weight: 600;
            transition: background 0.2s;
        }
        .btn:hover { background: #0056CC; }
        .note {
            font-size: 13px;
            color: #999;
            margin-top: 16px;
        }
    </style>
    <script>
        // Try to open the app first, then fall back to App Store
        (function() {
            var params = new URLSearchParams(window.location.search);
            var session = params.get('session');
            if (session) {
                // Try custom scheme (for older installs)
                window.location.href = 'balootscore://join?session=' + session;
                // If app doesn't open within 1.5s, redirect to App Store
                setTimeout(function() {
                    window.location.href = 'https://apps.apple.com/app/id6755610679';
                }, 1500);
            }
        })();
    </script>
</head>
<body>
    <div class="card">
        <div class="icon">🃏</div>
        <h1>BalootScore</h1>
        <p>You've been invited to follow a live Baloot score session. Download the app to join!</p>
        <a href="https://apps.apple.com/app/id6755610679" class="btn">Download on App Store</a>
        <p class="note">The app will open automatically if already installed.</p>
    </div>
</body>
</html>
